<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Invoker Lab">
  <!--
    The app's mark: the three reagents. Solid discs rather than the outlines a
    larger logo could afford, because a favicon is read at 16px where a 1px
    stroke disappears entirely. The dark disc behind them guarantees contrast
    on a light tab bar as well as a dark one.
  -->
  <circle cx="16" cy="16" r="16" fill="#0a0c16"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#b8934a" stroke-opacity="0.38"/>
  <circle cx="16" cy="10.1" r="4.7" fill="#5ad1ff"/>
  <circle cx="9.5" cy="21.4" r="4.7" fill="#b476ff"/>
  <circle cx="22.5" cy="21.4" r="4.7" fill="#ff7d3a"/>
</svg>
